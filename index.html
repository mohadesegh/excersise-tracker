<!doctype html>
<html lang="fa" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>Fitora | Personal workout plan</title>
		<meta name="application-name" content="Fitora" />
		<meta
			name="description"
			content="Personal workout plan in under a minute with 3D movement coaching."
		/>
		<meta
			name="theme-color"
			content="#f4f5f8"
			media="(prefers-color-scheme: light)"
		/>
		<meta
			name="theme-color"
			content="#090a0e"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/icon.svg" type="image/svg+xml" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<main id="app"></main>
		<nav id="tabs" aria-label="بخش‌ها" hidden>
			<div>
				<a href="#/today" data-tab="today">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linejoin="round"
						/>
					</svg>
					<span class="tab-label">Today</span>
				</a>
				<a href="#/library" data-tab="library">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="12" cy="4.5" r="2" fill="currentColor" />
						<path
							d="M12 7.5v7m0 0l-4 6.5m4-6.5l4 6.5M6 10.5h12"
							fill="none"
							stroke="currentColor"
							stroke-width="2.2"
							stroke-linecap="round"
						/>
					</svg>
					<span class="tab-label">Moves</span>
				</a>
				<a href="#/progress" data-tab="progress">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path
							d="M5 20V12m7 8V5m7 15v-9"
							fill="none"
							stroke="currentColor"
							stroke-width="2.4"
							stroke-linecap="round"
						/>
					</svg>
					<span class="tab-label">Progress</span>
				</a>
				<a href="#/profile" data-tab="profile">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<circle
							cx="12"
							cy="8"
							r="4"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
						/>
						<path
							d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
						/>
					</svg>
					<span class="tab-label">Profile</span>
				</a>
			</div>
		</nav>
		<noscript>
			<p lang="fa" dir="rtl">برای استفاده از فیتورا، جاوااسکریپت را فعال کنید.</p>
			<p lang="tr" dir="ltr">Fitora'yı kullanmak için JavaScript'i etkinleştirin.</p>
			<p lang="en" dir="ltr">Enable JavaScript to use Fitora.</p>
		</noscript>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
